<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VoiceForm - Fale e Preencha</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 280px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #6366f1, #06b6d4);
        color: white;
      }
      .wrap { padding: 20px; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0 0 16px; font-size: 12px; opacity: 0.9; line-height: 1.5; }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: rgba(255,255,255,0.95);
        color: #4338ca;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button:hover { background: white; }
      .hint { font-size: 11px; opacity: 0.85; margin-top: 10px; }
      kbd { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 4px; font-size: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🎙️ VoiceForm</h1>
      <p>Escaneie a página para encontrar entradas, ouça-as em voz alta e dite as respostas.</p>
      <button id="scan">Escanear esta página</button>
      <button id="start">Iniciar sessão de voz</button>
      <button id="stop">Parar</button>
      <div class="hint">Dica: pressione <kbd>Alt</kbd> + <kbd>V</kbd> em qualquer página para alternar.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
